<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
*{margin:0}
#icon{width:512px;height:512px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,#ffb0ca 0%,#ff8fb3 45%,#ff5f96 100%);}
#icon .v{position:absolute;top:50%;left:50%;transform:translate(-50%,-54%);font-size:300px;line-height:1;
  filter:drop-shadow(0 14px 26px rgba(150,30,80,.35))}
#icon .b{position:absolute;top:34px;right:40px;font-size:96px;transform:rotate(18deg);
  filter:drop-shadow(0 6px 12px rgba(150,30,80,.3))}
#icon .n{position:absolute;bottom:52px;left:56px;font-size:64px;transform:rotate(-12deg);opacity:.9}
#icon .s1{position:absolute;top:88px;left:70px;font-size:52px;opacity:.95}
#icon .s2{position:absolute;bottom:96px;right:88px;font-size:44px;opacity:.9}
</style></head><body>
<div id="icon">
  <span class="v">🎻</span>
  <span class="b">🎀</span>
  <span class="n">♪</span>
  <span class="s1">✨</span>
  <span class="s2">✨</span>
</div>
</body></html>
